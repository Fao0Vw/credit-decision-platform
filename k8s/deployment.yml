apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: credit-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          livenessProbe:
              httpGet:
                path: /error
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 5
          readinessProbe:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 5
